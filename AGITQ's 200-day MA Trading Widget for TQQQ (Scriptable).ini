// --- 위젯 설정 (Configuration) ---

// 1. 위젯 정보
const WIDGET_TITLE = "아기티큐 200일선 매매법";
const WIDGET_UPDATE_INFO = "v1.16 (25.10.17. 업데이트)";

// 2. 기준 종목 (TQQQ로 고정)
const TICKER = "TQQQ";

// 3. 데이터 조회 및 차트 표시 기간 (일)
const DATA_RANGE_DAYS = 450;
const CHART_DISPLAY_DAYS = 220;

// 4. 과열 기준선 퍼센트 (%)
const ENVELOPE_PERCENTAGE = 5;

// 5. 위젯 클릭 시 이동할 블로그 주소
const BLOG_URL = "https://blog.naver.com/humblich";

// 6. 디자인 색상 설정 (고정 테마)
const COLORS = {
    background: new Color("#000000"),
    textPrimary: new Color("#FFFFFF"),
    textSecondary: new Color("#AAAAAA"),
    overheat: new Color("#9A30AE"), // 과열 상황
    focus: new Color("#FC5230"),    // 집중 투자 상황
    decline: new Color("#18A8F1"),  // 하락 상황
    priceLine: new Color("#FC5230"),    // TQQQ 현재가 라인
    ma200Line: new Color("#7DB249"),
    envelopeLine: new Color("#9A30AE")
};

// 7. 차트 크기 설정
const CHART_DIMENSIONS = { width: 500, height: 300, padding: 15 };


// --- 핵심 로직 (Core Logic) ---

const CacheManager = {
    fm: FileManager.local(),
    cacheDir: FileManager.local().joinPath(FileManager.local().documentsDirectory(), "agitq_widget_cache"),
    
    setup() {
        if (!this.fm.fileExists(this.cacheDir)) {
            this.fm.createDirectory(this.cacheDir, true);
        }
    },
    
    read(fileName) {
        try {
            const path = this.fm.joinPath(this.cacheDir, fileName);
            if (!this.fm.fileExists(path)) return null;
            if (fileName.endsWith('.json')) return JSON.parse(this.fm.readString(path));
            return this.fm.readImage(path);
        } catch (e) { return null; }
    },

    write(fileName, data) {
        try {
            const path = this.fm.joinPath(this.cacheDir, fileName);
            if (fileName.endsWith('.json')) this.fm.writeString(path, JSON.stringify(data));
            else if (data instanceof Image) this.fm.writeImage(path, data);
        } catch (e) { console.error(`캐시 쓰기 오류: ${e}`); }
    }
};

async function fetchStockData() {
    try {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${TICKER}?range=${DATA_RANGE_DAYS}d&interval=1d`;
        const req = new Request(url);
        const json = await req.loadJSON();
        const result = json.chart.result[0];
        const timestamps = result.timestamp;
        const closes = result.indicators.quote[0].close.map(p => p === null ? 0 : p);
        const currentPrice = result.meta.regularMarketPrice;
        if (closes.length > 0) closes[closes.length - 1] = currentPrice;
        
        let lastValidTimestamp = null;
        for (let i = timestamps.length - 1; i >= 0; i--) {
            if (closes[i] !== null && closes[i] > 0) {
                lastValidTimestamp = timestamps[i];
                break;
            }
        }
        return { closes, marketTime: lastValidTimestamp };
    } catch (e) {
        console.error(`데이터 로딩 실패 (${TICKER}): ${e}`);
        return null;
    }
}

function calculateMovingAverage(data, period) {
    let ma = new Array(data.length).fill(NaN);
    if (data.length < period) return ma;
    let sum = data.slice(0, period).reduce((a, b) => a + b, 0);
    ma[period - 1] = sum / period;
    for (let i = period; i < data.length; i++) {
        sum = sum - data[i - period] + data[i];
        ma[i] = sum / period;
    }
    return ma;
}

function drawChart(closes, ma200, envelope) {
    const ctx = new DrawContext();
    ctx.size = new Size(CHART_DIMENSIONS.width, CHART_DIMENSIONS.height);
    ctx.respectScreenScale = true;
    ctx.setFillColor(COLORS.background);
    ctx.fillRect(new Rect(0, 0, CHART_DIMENSIONS.width, CHART_DIMENSIONS.height));

    const plot = (data, color) => {
        const path = new Path();
        let started = false;
        data.forEach(p => {
            if (!isNaN(p.y)) {
                if (!started) { path.move(new Point(p.x, p.y)); started = true; } 
                else { path.addLine(new Point(p.x, p.y)); }
            }
        });
        ctx.setStrokeColor(color);
        ctx.setLineWidth(4);
        ctx.addPath(path);
        ctx.strokePath();
    };

    const dataSets = [closes, ma200, envelope].map(d => d.slice(-CHART_DISPLAY_DAYS));
    const allValues = dataSets.flat().filter(v => !isNaN(v));
    const [minY, maxY] = [Math.min(...allValues), Math.max(...allValues)];

    const transform = (val, i) => ({
        x: CHART_DIMENSIONS.padding + (i / (CHART_DISPLAY_DAYS - 1)) * (CHART_DIMENSIONS.width - CHART_DIMENSIONS.padding * 2),
        y: CHART_DIMENSIONS.height - CHART_DIMENSIONS.padding - ((val - minY) / (maxY - minY)) * (CHART_DIMENSIONS.height - CHART_DIMENSIONS.padding * 2)
    });

    plot(dataSets[2].map(transform), COLORS.envelopeLine);
    plot(dataSets[1].map(transform), COLORS.ma200Line);
    plot(dataSets[0].map(transform), COLORS.priceLine);

    return ctx.getImage();
}

function determineSituation(closes, ma200Series) {
    const currentPrice = closes[closes.length - 1];
    const yesterdayPrice = closes[closes.length - 2];
    const currentMA200 = ma200Series.filter(v => !isNaN(v)).pop();
    const yesterdayMA200 = ma200Series.slice(0, -1).filter(v => !isNaN(v)).pop();
    const envelope = currentMA200 * (1 + ENVELOPE_PERCENTAGE / 100);

    if (currentPrice > currentMA200 && yesterdayPrice <= yesterdayMA200) {
        return { name: "상승 신호 발생!", principle: "내일 종가 확인 후 진입", color: COLORS.focus.hex };
    }
    if (currentPrice > envelope) {
        return { name: "과열 상황", principle: "TQQQ 유지, SPLG 추가매수", color: COLORS.overheat.hex };
    }
    if (currentPrice > currentMA200) {
        return { name: "집중 투자 상황", principle: "SPLG 유지·SGOV 매도, TQQQ 매수", color: COLORS.focus.hex };
    }
    return { name: "하락 상황", principle: "SPLG·TQQQ 매도", color: COLORS.decline.hex };
}

function createWidget(data) {
    const widget = new ListWidget();
    widget.backgroundColor = COLORS.background;
    widget.url = BLOG_URL;
    widget.setPadding(12, 12, 12, 12);

    const titleText = widget.addText(WIDGET_TITLE);
    titleText.font = Font.boldSystemFont(15);
    titleText.textColor = COLORS.textPrimary;
    widget.addSpacer(4);

    const subHeader = widget.addStack();
    const updateText = subHeader.addText(`위젯 업데이트: ${WIDGET_UPDATE_INFO}`);
    updateText.font = Font.mediumSystemFont(9);
    updateText.textColor = COLORS.textSecondary;
    subHeader.addSpacer();
    const dateText = subHeader.addText(data.formattedDate);
    dateText.font = Font.systemFont(10);
    dateText.textColor = COLORS.textPrimary;

    widget.addSpacer(8);

    const content = widget.addStack();
    content.addImage(data.chartImage);
    content.addSpacer(15);

    const info = content.addStack();
    info.layoutVertically();
    info.addSpacer();
    const situationText = info.addText(data.situation.name);
    situationText.font = Font.boldSystemFont(18);
    situationText.textColor = new Color(data.situation.color);
    
    const principleText = info.addText(data.situation.principle);
    principleText.font = Font.systemFont(12);
    principleText.textColor = COLORS.textPrimary;

    info.addSpacer(8);

    const addStat = (label, value, color) => {
        const line = info.addStack();
        const labelText = line.addText(label);
        labelText.font = Font.mediumSystemFont(11);
        labelText.textColor = color;
        line.addSpacer();
        const valueText = line.addText(value);
        valueText.font = Font.boldSystemFont(11);
        valueText.textColor = color;
    };
    
    addStat("TQQQ 현재가", `$${data.currentPrice.toFixed(2)}`, COLORS.priceLine);
    addStat("200일 이동평균", `$${data.ma200.toFixed(2)}`, COLORS.ma200Line);
    addStat("+5% Envelope", `$${data.envelope.toFixed(2)}`, COLORS.envelopeLine);
    
    info.addSpacer();
    
    return widget;
}

async function buildWidget() {
    CacheManager.setup();
    
    const freshStockData = await fetchStockData();
    if (!freshStockData || !freshStockData.closes || freshStockData.closes.length < 200) {
        let cachedData = CacheManager.read('widgetData.json');
        let chartImage = CacheManager.read('chartImage.png');
        if (cachedData && chartImage) {
            return createWidget({ ...cachedData, chartImage });
        } else {
            const errorWidget = new ListWidget();
            errorWidget.backgroundColor = COLORS.background;
            errorWidget.addText(`${TICKER} 데이터 로딩 실패`).textColor = COLORS.textPrimary;
            return errorWidget;
        }
    }

    const nyDateFormatter = new DateFormatter();
    nyDateFormatter.dateFormat = "yyyy-MM-dd";
    nyDateFormatter.timeZone = "America/New_York";
    const marketDateStr = nyDateFormatter.string(new Date(freshStockData.marketTime * 1000));

    let cachedData = CacheManager.read('widgetData.json');
    let chartImage = CacheManager.read('chartImage.png');

    if (cachedData && typeof cachedData.situation.color !== 'string') {
        cachedData = null; 
    }

    if (cachedData && chartImage && cachedData.dataDate === marketDateStr) {
        return createWidget({ ...cachedData, chartImage });
    }
    
    const { closes, marketTime } = freshStockData;
    const ma200Series = calculateMovingAverage(closes, 200);
    const situation = determineSituation(closes, ma200Series);
    chartImage = drawChart(closes, ma200Series, ma200Series.map(v => v * (1 + ENVELOPE_PERCENTAGE / 100)));

    const displayDateFormatter = new DateFormatter();
    displayDateFormatter.dateFormat = "yy.MM.dd. '종가 기준'";
    displayDateFormatter.locale = "ko-kr";
    displayDateFormatter.timeZone = "America/New_York";
    
    const lastValidMA200 = ma200Series.filter(v => !isNaN(v)).pop();
    const currentPrice = closes[closes.length - 1];

    const newData = {
        dataDate: marketDateStr,
        formattedDate: displayDateFormatter.string(new Date(marketTime * 1000)),
        situation,
        currentPrice: currentPrice,
        ma200: lastValidMA200,
        envelope: isNaN(lastValidMA200) ? 0 : lastValidMA200 * (1 + ENVELOPE_PERCENTAGE / 100),
    };
    
    CacheManager.write('widgetData.json', newData);
    CacheManager.write('chartImage.png', chartImage);
    
    return createWidget({ ...newData, chartImage });
}

// --- 스크립트 실행 ---
if (config.runsInWidget) {
    Script.setWidget(await buildWidget());
} else {
    const table = new UITable();
    const headerRow = new UITableRow();
    const titleCell = headerRow.addText("테스트 실행 메뉴");
    titleCell.titleFont = Font.headline();
    headerRow.isHeader = true;
    table.addRow(headerRow);

    const row = new UITableRow();
    row.addText("중간 크기 위젯 미리보기");
    row.onSelect = async () => await (await buildWidget()).presentMedium();
    table.addRow(row);
    await table.present();
}

Script.complete();

